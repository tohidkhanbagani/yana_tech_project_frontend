<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yana OS | Employee Workspace</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0f172a', primary: '#4f46e5',
                            accent: '#10b981', alert: '#f43f5e',
                            surface: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            border-color: #4f46e5;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-exit {
            animation: fadeOut 0.4s ease forwards;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Desktop Sidebar Collapse Styles */
        @media (min-width: 768px) {
            #main-sidebar {
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow-x: hidden;
            }

            #main-sidebar.sidebar-collapsed {
                width: 5rem;
            }

            #main-sidebar.sidebar-collapsed span {
                display: none;
            }

            #main-sidebar.sidebar-collapsed .h-16 {
                padding-left: 0 !important;
                padding-right: 0 !important;
                justify-content: center;
            }

            #main-sidebar.sidebar-collapsed .mr-3 {
                margin-right: 0 !important;
            }

            #main-sidebar.sidebar-collapsed .nav-btn {
                padding-left: 0 !important;
                padding-right: 0 !important;
                justify-content: center;
            }

            #main-sidebar.sidebar-collapsed .p-4 {
                padding-left: 0.5rem !important;
                padding-right: 0.5rem !important;
            }
        }

        /* Custom stacked notification CSS overrides */
        #toast-container {
            display: block !important;
            pointer-events: auto;
        }
        .toast-item {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        #toast-container:not(:hover) .toast-item {
            pointer-events: none;
        }
        #toast-container:not(:hover) .toast-item:last-child {
            position: relative;
            transform: translate3d(0, 0, 0) scale(1);
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
        }
        #toast-container:not(:hover) .toast-item:nth-last-child(2) {
            transform: translate3d(0, 10px, 0) scale(0.96);
            z-index: 90;
            opacity: 0.9;
        }
        #toast-container:not(:hover) .toast-item:nth-last-child(3) {
            transform: translate3d(0, 20px, 0) scale(0.92);
            z-index: 80;
            opacity: 0.8;
        }
        #toast-container:not(:hover) .toast-item:nth-last-child(n+4) {
            transform: translate3d(0, 30px, 0) scale(0.88);
            z-index: 70;
            opacity: 0;
            visibility: hidden;
        }
        #toast-container:hover .toast-item {
            position: relative;
            transform: translate3d(0, 0, 0) scale(1) !important;
            opacity: 1 !important;
            visibility: visible !important;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        #toast-container:hover .toast-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body class="text-slate-800 antialiased h-screen w-screen overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container"
        class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none"></div>

    <!-- Global Modal -->
    <div id="globalModal"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800 tracking-tight"></h3>
                <button onclick="closeModal()"
                    class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-lg"><i data-lucide="x"
                        class="w-5 h-5"></i></button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Main SPA Mount Point -->
    <div id="app" class="h-full w-full"></div>

    <script>
        /**
         * YANA OS - EMPLOYEE PORTAL ENGINE
         */

        const CONFIG = {
            API_BASE_URL: 'https://yana-tech-project-backend-d0sj.onrender.com',
            TOKEN_KEY: 'yana_os_token',
            LOGIN_URL: "index.html"
        };

        const state = {
            user: null,
            currentView: sessionStorage.getItem('lastEmployeeView') || 'dashboard',
            employeeData: null,
            employeeTasks: [],
            projects: [],
            myAttendance: [], // ADDED FOR ATTENDANCE
            isEditingProfile: false,
            editSkills: [],
            devTechStack: [],
            appShellRendered: false, // ARCHITECTURE FIX: Prevents full-page reloading
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            activeTimesheetSection: 'milestones',
            milestoneTab: 'active'
        };

        // --- Utilities ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let iconSvg = ''; let bgColor = '';

            if (type === 'error') { bgColor = 'bg-brand-alert'; iconSvg = `<i data-lucide="alert-circle" class="w-5 h-5 text-white"></i>`; }
            else if (type === 'success') { bgColor = 'bg-brand-accent'; iconSvg = `<i data-lucide="check-circle-2" class="w-5 h-5 text-white"></i>`; }
            else { bgColor = 'bg-slate-800'; iconSvg = `<i data-lucide="info" class="w-5 h-5 text-white"></i>`; }

            toast.className = `toast-item toast-enter flex items-center p-4 rounded-lg shadow-lg text-white pointer-events-auto ${bgColor}`;
            toast.innerHTML = `<div class="mr-3">${iconSvg}</div><div class="font-medium text-sm flex-1">${message}</div><button onclick="this.parentElement.remove()" class="ml-4 opacity-80 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-exit'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) { return null; }
        }

        // --- Modals ---
        function openModal(title, content) {
            const m = document.getElementById('globalModal');
            if (m) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalBody').innerHTML = content;
                m.classList.remove('hidden');
                lucide.createIcons();
            }
        }
        function closeModal() {
            const m = document.getElementById('globalModal');
            if (m) m.classList.add('hidden');
        }

        function customConfirm(title, message, confirmText = 'Confirm', cancelText = 'Cancel', isDanger = false) {
            return new Promise((resolve) => {
                const btnClass = isDanger ? 'bg-rose-500 hover:bg-rose-600 text-white shadow-rose-500/20' : 'bg-brand-primary hover:bg-indigo-600 text-white shadow-indigo-500/20';
                const iconStr = isDanger ? '<i data-lucide="alert-triangle" class="w-6 h-6 text-rose-500"></i>' : '<i data-lucide="help-circle" class="w-6 h-6 text-brand-primary"></i>';

                const html = `
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-full ${isDanger ? 'bg-rose-100' : 'bg-indigo-50'} flex items-center justify-center shrink-0">
                            ${iconStr}
                        </div>
                        <div class="flex-1">
                            <p class="text-slate-600 mb-6 text-sm">${message}</p>
                            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                <button type="button" id="confirm-cancel-btn" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">${cancelText}</button>
                                <button type="button" id="confirm-ok-btn" class="px-5 py-2 ${btnClass} rounded-lg font-medium shadow-sm transition-all flex items-center gap-2">
                                    ${confirmText}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                openModal(title, html);

                document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
                    closeModal();
                    resolve(false);
                });
                document.getElementById('confirm-ok-btn').addEventListener('click', () => {
                    closeModal();
                    resolve(true);
                });
            });
        }

        function customAlert(title, message) {
            return new Promise((resolve) => {
                const html = `
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center shrink-0">
                            <i data-lucide="info" class="w-6 h-6 text-brand-primary"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-slate-600 mb-6 text-sm">${message}</p>
                            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                <button type="button" id="alert-ok-btn" class="px-5 py-2 bg-brand-primary hover:bg-indigo-600 text-white shadow-indigo-500/20 rounded-lg font-medium shadow-sm transition-all">
                                    OK
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                openModal(title, html);

                document.getElementById('alert-ok-btn').addEventListener('click', () => {
                    closeModal();
                    resolve(true);
                });
            });
        }

        const activeRequestsCache = new Map();
        async function apiFetch(endpoint, options = {}) {
            const method = (options.method || "GET").toUpperCase();

            if (method === "GET") {
                if (activeRequestsCache.has(endpoint)) {
                    return activeRequestsCache.get(endpoint);
                }

                const promise = (async () => {
                    const token = localStorage.getItem(CONFIG.TOKEN_KEY);
                    const headers = { ...options.headers };
                    if (token) headers['Authorization'] = `Bearer ${token}`;
                    if (!headers['Content-Type'] && !(options.body instanceof FormData) && typeof options.body !== 'string') {
                        headers['Content-Type'] = 'application/json';
                        if (options.body) options.body = JSON.stringify(options.body);
                    }

                    try {
                        const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, { ...options, headers });
                        if (response.status === 401) { logout(false); throw new Error("Session expired."); }
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            let errMsg = "An unexpected error occurred.";
                            if (Array.isArray(data.detail)) {
                                errMsg = data.detail.map(e => `${e.loc.join('.')} - ${e.msg}`).join(', ');
                            } else if (data.detail) {
                                errMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                            } else if (data.error) {
                                errMsg = typeof data.error === 'string' ? data.error : JSON.stringify(data.error);
                            } else if (data.critical_error) {
                                errMsg = typeof data.critical_error === 'string' ? data.critical_error : JSON.stringify(data.critical_error);
                            }
                            throw new Error(errMsg);
                        }
                        return data;
                    } catch (error) {
                        if (error.message === "Failed to fetch") showToast("Unable to connect to the server.", "error");
                        throw error;
                    } finally {
                        activeRequestsCache.delete(endpoint);
                    }
                })();

                activeRequestsCache.set(endpoint, promise);
                return promise;
            }

            const token = localStorage.getItem(CONFIG.TOKEN_KEY);
            const headers = { ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (!headers['Content-Type'] && !(options.body instanceof FormData) && typeof options.body !== 'string') {
                headers['Content-Type'] = 'application/json';
                if (options.body) options.body = JSON.stringify(options.body);
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, { ...options, headers });
                if (response.status === 401) { logout(false); throw new Error("Session expired."); }
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    let errMsg = "An unexpected error occurred.";
                    if (Array.isArray(data.detail)) {
                        errMsg = data.detail.map(e => `${e.loc.join('.')} - ${e.msg}`).join(', ');
                    } else if (data.detail) {
                        errMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                    } else if (data.error) {
                        errMsg = typeof data.error === 'string' ? data.error : JSON.stringify(data.error);
                    } else if (data.critical_error) {
                        errMsg = typeof data.critical_error === 'string' ? data.critical_error : JSON.stringify(data.critical_error);
                    }
                    throw new Error(errMsg);
                }
                return data;
            } catch (error) {
                if (error.message === "Failed to fetch") showToast("Unable to connect to the server.", "error");
                throw error;
            }
        }

        async function logout(showNotification = true) {
            localStorage.removeItem(CONFIG.TOKEN_KEY);
            if (showNotification) await customAlert("Logged Out", "Logged out successfully");
            window.location.href = CONFIG.LOGIN_URL;
        }

        // --- Data Loaders ---
        async function loadEmployeeWorkspaceData() {
            try {
                const [projects, tasks, profile, attendance, leaveRequests, allEmployees, holidays, backupCoverages, milestones] = await Promise.all([
                    apiFetch(`/projects/employee/${state.user.id}`).catch(() => []),
                    apiFetch(`/tasks/get_by_employee/${state.user.id}`).catch(() => []),
                    apiFetch(`/employees/get/${state.user.id}`).catch(() => ({})),
                    apiFetch(`/attendance/me`).catch(() => []),
                    apiFetch(`/attendance/leave-requests/me`).catch(() => []),
                    apiFetch(`/employees/all`).catch(() => []),
                    apiFetch(`/attendance/holidays`).catch(() => []),
                    apiFetch(`/attendance/leave-requests/backup-coverages`).catch(() => []),
                    apiFetch(`/projects/timeline/employee/${state.user.id}`).catch(() => [])
                ]);

                state.projects = Array.isArray(projects) ? projects : [];
                state.employeeTasks = Array.isArray(tasks) ? tasks : [];
                state.employeeData = profile && !profile.error ? profile : {};
                state.myAttendance = Array.isArray(attendance) ? attendance : [];
                state.myLeaveRequests = Array.isArray(leaveRequests) ? leaveRequests : [];
                state.allEmployees = Array.isArray(allEmployees) ? allEmployees : [];
                state.holidays = Array.isArray(holidays) ? holidays : [];
                state.backupCoverages = Array.isArray(backupCoverages) ? backupCoverages : [];
                state.myMilestones = Array.isArray(milestones) ? milestones : [];

                // Fetch timelines for all assigned projects
                state.projectTimelines = {};
                if (state.projects.length > 0) {
                    const timelinePromises = state.projects.map(p =>
                        apiFetch(`/projects/timeline/${p.id}`).catch(() => [])
                    );
                    const timelines = await Promise.all(timelinePromises);
                    state.projects.forEach((p, index) => {
                        state.projectTimelines[p.id] = timelines[index];
                    });
                }
                // Calculate notifications after loading all workspace data
                window.calculateNotifications();
            } catch (error) {
                showToast("Failed to load workspace data: " + error.message, "error");
            }
        }
        // --- Routing Engine ---
        async function routeApp(view = null) {
            if (view) {
                state.currentView = view;
                sessionStorage.setItem('lastEmployeeView', view); // Save View

                // Close mobile sidebar on navigation
                const sidebar = document.getElementById('main-sidebar');
                if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                    toggleMobileSidebar();
                }
            }

            const appDiv = document.getElementById('app');

            if (!state.employeeData) {
                appDiv.innerHTML = `
                    <div class="h-full w-full flex items-center justify-center bg-slate-50">
                        <div class="flex flex-col items-center">
                            <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-brand-primary mb-4"></i>
                            <p class="text-slate-500 font-medium">Loading Workspace...</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                await loadEmployeeWorkspaceData();
            }
            renderEmployeeApp();
        }

        // --- UI Rendering ---
        function renderEmployeeApp() {
            const appDiv = document.getElementById('app');

            let contentHtml = '';
            if (state.currentView === 'dashboard') contentHtml = getEmployeeDashboardTemplate();
            else if (state.currentView === 'log-dev') contentHtml = getDevTaskFormTemplate();
            else if (state.currentView === 'log-content') contentHtml = getContentTaskFormTemplate();
            else if (state.currentView === 'profile') contentHtml = getEmployeeProfileTemplate();
            else if (state.currentView === 'leave-requests') contentHtml = getEmployeeLeaveRequestsTemplate(); // ADDED
            else if (state.currentView === 'timesheets') contentHtml = getEmployeeTimesheetsTemplate();
            else if (state.currentView === 'projects-milestones') contentHtml = getProjectsMilestonesTemplate();

            if (!state.appShellRendered) {
                const sidebarClass = localStorage.getItem('yanaSidebarCollapsed') === 'true' ? 'sidebar-collapsed' : '';
                appDiv.innerHTML = `
                    <div class="flex h-full w-full bg-slate-50 overflow-hidden relative">
                        <!-- Mobile Sidebar Overlay -->
                        <div id="mobile-sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden opacity-0 transition-opacity duration-300" onclick="toggleMobileSidebar()"></div>
                        
                        <!-- Sidebar -->
                        <aside id="main-sidebar" class="w-64 bg-brand-dark text-slate-300 flex flex-col shrink-0 transition-transform duration-300 z-50 fixed md:relative h-full -translate-x-full md:translate-x-0 ${sidebarClass}">
                            <div class="h-16 flex items-center px-6 bg-slate-900 border-b border-slate-800 shrink-0">
                                <div class="w-8 h-8 bg-brand-primary rounded-md flex items-center justify-center mr-3 shadow-lg">
                                    <i data-lucide="layers" class="text-white w-5 h-5"></i>
                                </div>
                                <span class="font-bold text-white text-lg tracking-tight">Yana OS</span>
                            </div>
                            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto" id="sidebar-nav">
                                <button onclick="routeApp('dashboard')" data-view="dashboard" class="nav-btn w-full flex items-center px-4 py-3 rounded-xl transition-all">
                                    <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 flex-shrink-0"></i> <span class="font-medium text-sm truncate">Dashboard</span>
                                </button>
                                <button onclick="routeApp('profile')" data-view="profile" class="nav-btn w-full flex items-center px-4 py-3 rounded-xl transition-all">
                                    <i data-lucide="user" class="w-5 h-5 mr-3 flex-shrink-0"></i> <span class="font-medium text-sm truncate">My Profile</span>
                                </button>
                                <button onclick="routeApp('leave-requests')" data-view="leave-requests" class="nav-btn w-full flex items-center px-4 py-3 rounded-xl transition-all">
                                    <i data-lucide="calendar" class="w-5 h-5 mr-3 flex-shrink-0"></i> <span class="font-medium text-sm truncate">Leave Requests</span>
                                </button>
                                <button onclick="routeApp('projects-milestones')" data-view="projects-milestones" class="nav-btn w-full flex items-center px-4 py-3 rounded-xl transition-all">
                                    <i data-lucide="folder-kanban" class="w-5 h-5 mr-3 flex-shrink-0"></i> <span class="font-medium text-sm truncate" title="Projects & Milestones">Projects & Milestones</span>
                                </button>
                                <button onclick="routeApp('timesheets')" data-view="timesheets" class="nav-btn w-full flex items-center px-4 py-3 rounded-xl transition-all">
                                    <i data-lucide="clock" class="w-5 h-5 mr-3 flex-shrink-0"></i> <span class="font-medium text-sm truncate">Timesheets</span>
                                </button>
                            </nav>
                            <div class="p-4 border-t border-slate-800">
                                <button onclick="logout()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-brand-alert hover:text-white transition-all group">
                                    <i data-lucide="log-out" class="w-5 h-5 mr-3 group-hover:text-white text-slate-400 transition-colors"></i> <span class="font-medium">Logout</span>
                                </button>
                            </div>
                        </aside>

                        <!-- Main Content -->
                        <div class="flex-1 flex flex-col overflow-hidden relative">
                            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 md:px-8 shrink-0 z-50 shadow-sm relative">
                                <div class="flex items-center gap-3">
                                    <button onclick="toggleMobileSidebar()" class="text-slate-500 hover:text-brand-primary transition-colors focus:outline-none">
                                        <i data-lucide="menu" class="w-6 h-6"></i>
                                    </button>
                                    <h2 id="header-title" class="text-xl font-bold text-slate-800 tracking-tight capitalize">${state.currentView.replace('-', ' ')}</h2>
                                </div>
                                <div class="flex items-center gap-4">
                                    <!-- Notification Center Bell -->
                                    <div class="relative" id="notification-center">
                                        <button onclick="window.toggleNotificationDropdown(event)" class="relative p-2 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors rounded-full hover:bg-slate-100 flex items-center justify-center">
                                            <i data-lucide="bell" class="w-5 h-5"></i>
                                            <span id="notif-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full border border-white hidden"></span>
                                        </button>
                                        <!-- Dropdown Menu -->
                                        <div id="notif-dropdown" class="absolute right-0 mt-2 w-80 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 hidden flex flex-col overflow-hidden max-h-96">
                                            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                                                <h4 class="font-bold text-slate-800 text-sm">Notifications</h4>
                                                <div class="flex items-center gap-2">
                                                    <button onclick="window.markAllNotificationsRead(event)" class="text-[10px] text-brand-primary hover:text-indigo-600 font-bold uppercase tracking-wider focus:outline-none">Mark all read</button>

            window.calculateNotifications();

            if (window.startElapsedTimer) window.startElapsedTimer();

                window.startProfileUnlockTimer();

                if (window.profileTimerInterval) clearInterval(window.profileTimerInterval);

        // --- View Templates ---
        function getEmployeeDashboardTemplate() {
            const now = new Date();
            const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
            startOfWeek.setHours(0, 0, 0, 0);

            // Determine active/today attendance status
            // First, find if there is an active check-in (no check-out time)
            let activeAttendance = null;
            if (state.myAttendance && state.myAttendance.length > 0) {
                activeAttendance = state.myAttendance.find(a => a.check_in_time && !a.check_out_time);
            }

            // Next, find today's completed attendance (using local date string YYYY-MM-DD)
            const localTodayStr = new Date().toLocaleDateString('sv-SE'); // Formats as YYYY-MM-DD local time
            let todayAttendance = null;
            if (state.myAttendance && state.myAttendance.length > 0) {
                todayAttendance = state.myAttendance.find(a => {
                    const checkInDate = a.check_in_time ? a.check_in_time.split(' ')[0] : (a.date ? a.date.split(' ')[0] : '');
                    return checkInDate === localTodayStr;
                });
            }

            // Decide which attendance to show in the widget
            let attendanceWidgetHtml = '';
            if (activeAttendance) {
                // Show checked-in state
                const checkInDateObj = new Date(activeAttendance.check_in_time);
                const checkInTime = checkInDateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const isToday = activeAttendance.check_in_time.startsWith(localTodayStr);
                const dateLabel = isToday ? 'today' : `on ${checkInDateObj.toLocaleDateString([], { month: 'short', day: 'numeric' })}`;

                attendanceWidgetHtml = `
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-500 rounded-2xl p-6 shadow-md flex flex-col md:flex-row items-center justify-between gap-4 mb-8 animate-in fade-in duration-350">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center border border-white/20 shrink-0">
                                <i data-lucide="check-circle" class="w-6 h-6 text-white animate-pulse"></i>
                            </div>
                            <div>
                                <h4 class="text-white font-bold text-lg flex items-center gap-2">You are Checked In</h4>
                                <p class="text-emerald-50 text-xs mt-0.5">Checked in at ${checkInTime} ${dateLabel}. Have a great workday!</p>
                            </div>
                        </div>
                        
                        <!-- Premium Clock Widget showing elapsed work hours (capped to hide overtime) -->
                        <div class="flex items-center gap-3 bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white shadow-inner backdrop-blur-sm shrink-0">
                            <div class="flex flex-col items-center">
                                <span class="text-[9px] font-black tracking-widest text-emerald-100 uppercase">Worktime Elapsed</span>
                                <span id="elapsed-timer-clock" class="text-lg font-black font-mono tracking-wider mt-0.5" data-checkin="${activeAttendance.check_in_time}">00:00:00</span>
                            </div>
                            <div class="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center animate-spin" style="animation-duration: 10s">
                                <i data-lucide="clock" class="w-4 h-4 text-emerald-100"></i>
                            </div>
                        </div>

                        <button onclick="handleCheckOut(event)" class="bg-white/20 hover:bg-white/30 border border-white/30 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all flex items-center shrink-0 backdrop-blur-sm hover:scale-[1.02] active:scale-[0.98]">
                            <i data-lucide="log-out" class="w-4 h-4 mr-2"></i> Check Out
                        </button>
                    </div>
                `;
            } else if (todayAttendance) {
                // Show shift completed state or absent state
                const checkInTime = todayAttendance.check_in_time ? new Date(todayAttendance.check_in_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
                const checkOutTime = todayAttendance.check_out_time ? new Date(todayAttendance.check_out_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
                const totalHrs = todayAttendance.total_hours ? (h => {
                    const tm = Math.round(h * 60);
                    const hrs = Math.floor(tm / 60);
                    const mins = tm % 60;
                    return `${hrs}h ${mins < 10 ? '0' : ''}${mins}m`;
                })(todayAttendance.total_hours) : '--';
                
                if (todayAttendance.status === 'Absent') {
                    // Employee was marked absent, but since they have no active attendance, show Check-In button!
                    // This allows them to check in even if auto-marked absent.
                    attendanceWidgetHtml = `
                        <div class="bg-gradient-to-r from-brand-dark to-slate-800 rounded-2xl p-6 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 animate-in fade-in duration-350">
                            <div>
                                <h4 class="text-white font-bold text-lg flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-rose-400"></i> Marked Absent</h4>
                                <p class="text-slate-300 text-sm mt-1">You were auto-marked absent today. You can still check in to start your work.</p>
                            </div>
                            <button onclick="handleCheckIn(event)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all flex items-center shrink-0">
                                <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Check In Now
                            </button>
                        </div>
                    `;
                } else {
                    attendanceWidgetHtml = `
                        <div class="bg-slate-200/50 border border-slate-200 rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 animate-in fade-in duration-350">
                            <div>
                                <h4 class="text-slate-700 font-bold text-lg flex items-center gap-2"><i data-lucide="check-check" class="w-5 h-5 text-brand-primary"></i> Shift Completed</h4>
                                <p class="text-slate-500 text-sm mt-1">In: ${checkInTime} &bull; Out: ${checkOutTime} &bull; <span class="font-bold text-slate-700">${totalHrs}</span> total.</p>
                            </div>
                        </div>
                    `;
                }
            } else {
                // Show default check-in state
                attendanceWidgetHtml = `
                    <div class="bg-gradient-to-r from-brand-dark to-slate-800 rounded-2xl p-6 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 animate-in fade-in duration-350">
                        <div>
                            <h4 class="text-white font-bold text-lg flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-emerald-400"></i> Start Your Day</h4>
                            <p class="text-slate-300 text-sm mt-1">Remember to check in to record your attendance today.</p>
                        </div>
                        <button onclick="handleCheckIn(event)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all flex items-center shrink-0">
                            <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Check In Now
                        </button>
                    </div>
                `;
            }

            // --- 1. Compute Dashboard Summaries (3 Blocks) ---
            const activeProjectIds = new Set(state.projects ? state.projects.map(p => p.id) : []);
            const projectsAssignedCount = state.projects ? state.projects.length : 0;
            
            // Only consider milestones that belong to active/non-completed projects
            let activeMilestonesForActiveProjects = [];
            if (state.myMilestones) {
                state.myMilestones.forEach(m => {
                    if (activeProjectIds.has(m.project_id)) {
                        activeMilestonesForActiveProjects.push(m);
                    }
                });
            }

            const pendingMilestones = activeMilestonesForActiveProjects.filter(m => (m.status || '').toLowerCase() !== 'completed');
            const activeMilestonesCount = pendingMilestones.length;

            let upcomingDeadlinesCount = 0;
            let overdueDeadlinesCount = 0;
            const nowTime = new Date();
            nowTime.setHours(0, 0, 0, 0);
            const warningLimit = new Date();
            warningLimit.setDate(nowTime.getDate() + 7); // 7 days window
            warningLimit.setHours(23, 59, 59, 999);

            // Build work deadlines radar lists
            let deadlineAlertsList = [];

            // Check projects deadlines (only active projects)
            if (state.projects) {
                state.projects.forEach(p => {
                    if (p.end_date && p.end_date !== 'N/A' && p.status !== 'Completed') {
                        const pDeadline = new Date(p.end_date);
                        if (!isNaN(pDeadline.getTime())) {
                            if (pDeadline < nowTime) {
                                overdueDeadlinesCount++;
                                deadlineAlertsList.push({
                                    type: 'Project Overdue',
                                    name: p.name,
                                    daysText: 'Overdue',
                                    dateText: p.end_date,
                                    isOverdue: true
                                });
                            } else if (pDeadline >= nowTime && pDeadline <= warningLimit) {
                                upcomingDeadlinesCount++;
                                const diffDays = Math.ceil((pDeadline - nowTime) / (1000 * 60 * 60 * 24));
                                deadlineAlertsList.push({
                                    type: 'Project Deadline',
                                    name: p.name,
                                    daysText: `Due in ${diffDays} day${diffDays > 1 ? 's' : ''}`,
                                    dateText: p.end_date,
                                    isOverdue: false
                                });
                            }
                        }
                    }
                });
            }

            // Check milestones deadlines (only milestones belonging to active projects and which are pending/active)
            pendingMilestones.forEach(m => {
                if (m.expected_end) {
                    const mDeadline = new Date(m.expected_end);
                    if (!isNaN(mDeadline.getTime())) {
                        if (mDeadline < nowTime) {
                            overdueDeadlinesCount++;
                            deadlineAlertsList.push({
                                type: 'Milestone Overdue',
                                name: `${m.projectName} &bull; ${m.milestone_name}`,
                                daysText: 'Overdue',
                                dateText: new Date(m.expected_end).toLocaleDateString([], { month: 'short', day: 'numeric' }),
                                isOverdue: true
                            });
                        } else if (mDeadline >= nowTime && mDeadline <= warningLimit) {
                            upcomingDeadlinesCount++;
                            const diffDays = Math.ceil((mDeadline - nowTime) / (1000 * 60 * 60 * 24));
                            deadlineAlertsList.push({
                                type: 'Milestone Deadline',
                                name: `${m.projectName} &bull; ${m.milestone_name}`,
                                daysText: `Due in ${diffDays} day${diffDays > 1 ? 's' : ''}`,
                                dateText: new Date(m.expected_end).toLocaleDateString([], { month: 'short', day: 'numeric' }),
                                isOverdue: false
                            });
                        }
                    }
                }
            });

            // Sort deadlines list: Overdue first, then upcoming soonest first
            deadlineAlertsList.sort((a, b) => {
                if (a.isOverdue && !b.isOverdue) return -1;
                if (!a.isOverdue && b.isOverdue) return 1;
                return new Date(a.dateText) - new Date(b.dateText);
            });

            // --- 2. Milestone board shower list generation (filter out ended projects) ---
            const showActive = (state.milestoneTab || 'active') === 'active';
            const filteredMilestones = activeMilestonesForActiveProjects.filter(m => {
                const isComp = (m.status || '').toLowerCase() === 'completed';
                return showActive ? !isComp : isComp;
            });

            const milestonesHtml = filteredMilestones.map(m => {
                const isDelayed = m.is_delayed || (m.status || '').toLowerCase() === 'delayed';
                const dueDate = m.expected_end ? new Date(m.expected_end).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A';
                const startDate = m.expected_start ? new Date(m.expected_start).toLocaleDateString([], { month: 'short', day: 'numeric' }) : 'N/A';
                
                // Tech badge
                const techBadge = m.work_type ? `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-semibold uppercase tracking-wider">${m.work_type}</span>` : '';
                
                // Status badge class
                let badgeClass = 'bg-slate-100 text-slate-600 border-slate-200';
                if ((m.status || '').toLowerCase() === 'active') badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                else if (isDelayed) badgeClass = 'bg-rose-50 text-rose-700 border-rose-200 animate-pulse';
                else if ((m.status || '').toLowerCase() === 'completed') badgeClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
                
                // Delay warning (past expected end and not completed)
                let riskAlertsHtml = '';
                if (isDelayed && (m.status || '').toLowerCase() !== 'completed') {
                    riskAlertsHtml += `
                        <div class="mt-2 px-3 py-2 bg-rose-50/50 border border-rose-100 rounded-xl flex items-center gap-2 text-rose-700 text-xs font-semibold">
                            <i data-lucide="clock" class="w-4 h-4 text-rose-500 shrink-0"></i>
                            <span>Milestone Overdue: Expected end date was ${dueDate}</span>
                        </div>
                    `;
                }

                return `
                    <div class="p-5 hover:bg-slate-50/50 transition-colors flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-1.5">
                                <h5 class="font-bold text-slate-800 text-sm md:text-base truncate max-w-md">${m.milestone_name}</h5>
                                ${techBadge}
                            </div>
                            <p class="text-xs font-medium text-slate-500 flex items-center gap-1.5 flex-wrap">
                                <span class="text-slate-700 font-bold">${m.projectName}</span>
                                <span>&bull;</span>
                                <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${startDate} - ${dueDate}</span>
                            </p>
                            ${riskAlertsHtml}
                        </div>
                        <div class="flex items-center gap-3 self-start md:self-auto shrink-0">
                            <span class="px-2.5 py-1 text-xs font-bold rounded-lg border ${badgeClass}">
                                ${m.status}
                            </span>
                        </div>
                    </div>
                `;
            }).join('') || `<p class="p-8 text-slate-400 text-center text-sm font-medium">No ${showActive ? 'active' : 'completed'} milestones found for active projects.</p>`;

            // --- 3. Handover Coverages ---
            const backupCoverages = state.backupCoverages || [];
            const backupCoveragesHtml = backupCoverages.map(cover => {
                const startStr = cover.start_date ? new Date(cover.start_date).toLocaleDateString() : 'N/A';
                const endStr = cover.end_date ? new Date(cover.end_date).toLocaleDateString() : 'N/A';
                
                const projObj = state.projects.find(p => p.id === cover.project_id);
                const projName = projObj ? projObj.name : 'N/A';
                
                let milestoneName = 'General Task (No Milestone)';
                if (cover.milestone_id && cover.project_id && state.projectTimelines) {
                    const milestones = state.projectTimelines[cover.project_id] || [];
                    const milestoneObj = milestones.find(m => m.id === cover.milestone_id);
                    if (milestoneObj) {
                        milestoneName = milestoneObj.milestone_name;
                    }
                }

                let detailsSection = '';
                if (cover.project_id) {
                    detailsSection = `
                        <div class="mt-1 text-xs text-slate-500 grid grid-cols-1 sm:grid-cols-2 gap-1.5 bg-slate-100/50 p-2.5 rounded-lg border border-slate-200/40 mb-3 font-medium">
                            <div><strong>Project:</strong> ${projName}</div>
                            <div><strong>Milestone:</strong> ${milestoneName}</div>
                            <div><strong>Task Type:</strong> ${cover.task_type === 'developer' ? 'Engineering' : cover.task_type === 'content' ? 'Content' : 'Both'}</div>
                        </div>
                    `;
                }

                let buttonsHtml = '';
                if (cover.status === 'Approved') {
                    const type = cover.task_type || 'both';
                    if (type === 'developer' || type === 'both') {
                        buttonsHtml += `
                            <button onclick="window.logHandoverTaskFor('${cover.employee_id}', 'dev')" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 rounded-xl text-xs font-bold transition-all shadow-sm">
                                <i data-lucide="terminal" class="w-3.5 h-3.5"></i> Log Engineering Handover
                            </button>
                        `;
                    }
                    if (type === 'content' || type === 'both') {
                        buttonsHtml += `
                            <button onclick="window.logHandoverTaskFor('${cover.employee_id}', 'content')" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 rounded-xl text-xs font-bold transition-all shadow-sm">
                                <i data-lucide="video" class="w-3.5 h-3.5"></i> Log Content Handover
                            </button>
                        `;
                    }
                }

                const actionArea = buttonsHtml ? `
                    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-200/60">
                        ${buttonsHtml}
                    </div>
                ` : '';

                // Badge status styling
                let statusBadgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                if (cover.status === 'Approved') {
                    statusBadgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                } else if (cover.status === 'Cancelled' || cover.status === 'Rejected') {
                    statusBadgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';
                }

                return `
                    <div class="p-5 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 mb-3">
                            <div>
                                <h5 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <i data-lucide="shield-alert" class="w-4 h-4 text-indigo-500"></i>
                                    Coverage for ${cover.employee_name}
                                </h5>
                                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                    ${startStr} - ${endStr} (${cover.total_days} ${cover.total_days === 1 ? 'day' : 'days'})
                                </p>
                            </div>
                            <div class="shrink-0">
                                <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider rounded-md ${statusBadgeClass}">
                                    ${cover.status}
                                </span>
                            </div>
                        </div>
                         <div class="bg-slate-50 border border-slate-100 rounded-xl p-3.5">
                            ${detailsSection}
                            <span class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 flex items-center gap-1">
                                <i data-lucide="clipboard-list" class="w-3 h-3 text-slate-400"></i>
                                Handover Task / Pending Work
                            </span>
                            <p class="text-xs text-slate-600 leading-relaxed font-medium mb-3">${cover.pending_work_summary || 'No pending work logged.'}</p>
                            ${actionArea}
                        </div>
                    </div>
                `;
            }).join('') || `
                <div class="p-6 text-center text-slate-500 text-sm italic">
                    No backup duties assigned to you.
                </div>
            `;

            // --- 4. Active Deadlines Radar (Focus on coming/overdue deadlines ONLY) ---
            const deadlineRadarHtml = deadlineAlertsList.map(alert => {
                const isOverdue = alert.isOverdue;
                const badgeColor = isOverdue ? 'bg-rose-50 text-rose-700 border-rose-200 animate-pulse' : 'bg-amber-50 text-amber-700 border-amber-200';
                const iconColor = isOverdue ? 'text-rose-500 bg-rose-50' : 'text-amber-500 bg-amber-50';
                const iconName = isOverdue ? 'alert-circle' : 'calendar-clock';
                
                return `
                    <div class="p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50/50 transition-colors animate-in fade-in">
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-lg ${iconColor} flex items-center justify-center shrink-0">
                                <i data-lucide="${iconName}" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center justify-between gap-2 mb-1">
                                    <span class="text-[10px] font-black uppercase tracking-wider ${isOverdue ? 'text-rose-600' : 'text-amber-600'}">${alert.type}</span>
                                    <span class="px-2 py-0.5 border rounded-full text-[9px] font-black ${badgeColor}">${alert.daysText}</span>
                                </div>
                                <p class="font-bold text-slate-800 text-sm leading-snug">${alert.name}</p>
                                <p class="text-xs text-slate-500 font-medium mt-1 flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-3 h-3"></i> Deadline: ${alert.dateText}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') || `
                <div class="p-8 text-center text-slate-400">

                    <!-- Block 2: Milestones Assigned -->

                        <div class="w-12 h-12 md:w-14 md:h-14 bg-emerald-50 rounded-xl flex items-center justify-center mr-4 md:mr-5 shrink-0">
                            <i data-lucide="target" class="w-6 h-6 md:w-7 md:h-7 text-brand-accent"></i>

                        <div>
                            <p class="text-xs md:text-sm text-slate-500 font-medium mb-1">Pending Milestones</p>

                    <!-- Block 3: Upcoming & Overdue Deadlines -->
                    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex items-center">
                        <div class="w-12 h-12 md:w-14 md:h-14 bg-amber-50 rounded-xl flex items-center justify-center mr-4 md:mr-5 shrink-0">
                            <i data-lucide="calendar-clock" class="w-6 h-6 md:w-7 md:h-7 text-amber-500"></i>
                        </div>
                        <div>
                            <p class="text-xs md:text-sm text-slate-500 font-medium mb-1">Upcoming/Overdue Deadlines</p>
                            <h4 class="text-2xl md:text-3xl font-black ${overdueDeadlinesCount > 0 ? 'text-rose-600 animate-pulse' : 'text-slate-800'}">${upcomingDeadlinesCount + overdueDeadlinesCount}</h4>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    <!-- Left Column: Actions & Active Milestones Board -->
                    <div class="lg:col-span-2 space-y-8">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h4 class="text-lg font-bold text-slate-800">Log Your Work</h4>

                                        </div>

                                    <p class="text-xs text-slate-500 font-medium">Log reels, videos, posters, and engagement metrics.</p>
                                </button>
                            </div>
                        </div>

                        <!-- Premium Milestones Board -->
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col animate-in fade-in duration-300">
                            <div class="px-6 py-4 border-b border-slate-100 bg-indigo-50/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="target" class="w-5 h-5 text-brand-primary"></i>
                                    <h4 class="font-bold text-slate-800">Your Milestone Board</h4>
                                </div>
                                <!-- Filter Tabs -->
                                <div class="flex bg-slate-100 p-1 rounded-xl shrink-0 self-start sm:self-auto border border-slate-200/50">
                                    <button onclick="window.switchMilestoneTab('active')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${showActive ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
                                        Active & Pending
                                    </button>
                                    <button onclick="window.switchMilestoneTab('completed')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${!showActive ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
                                        Completed

                            <div class="flex flex-col divide-y divide-slate-100 max-h-[450px] overflow-y-auto">

                    <!-- Right Column: Active Deadlines Radar -->

                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-full flex flex-col animate-in fade-in duration-300">

                ${getCalendarHtml()}

        }

        window.switchMilestoneTab = function(tab) {
            state.milestoneTab = tab;
            routeApp();
        };

        window.changeCalendarMonth = function (offset) {
            state.calendarMonth += offset;
            if (state.calendarMonth < 0) {
                state.calendarMonth = 11;
                state.calendarYear -= 1;
            } else if (state.calendarMonth > 11) {
                state.calendarMonth = 0;
                state.calendarYear += 1;
            }
            renderEmployeeApp();
        };

        function getCalendarHtml() {
            const year = state.calendarYear || new Date().getFullYear();
            const month = (state.calendarMonth !== undefined) ? state.calendarMonth : new Date().getMonth();

            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            const firstDayOfMonth = new Date(year, month, 1);
            const startDayOfWeek = firstDayOfMonth.getDay();
            const numDaysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthNumDays = new Date(year, month, 0).getDate();

            // Pre-process holidays
            const holidayMap = {};
            (state.holidays || []).forEach(h => {
                const hDate = h.date.split(' ')[0];
                holidayMap[hDate] = h;
            });

            // Pre-process attendance
            const attendanceMap = {};
            (state.myAttendance || []).forEach(a => {
                const aDate = a.date ? a.date.split(' ')[0] : (a.check_in_time ? a.check_in_time.split(' ')[0] : '');
                if (!aDate) return;
                
                const current = attendanceMap[aDate];
                if (!current) {
                    attendanceMap[aDate] = a;
                } else {
                    const priority = { 'Present': 4, 'Late': 3, 'Half-Day': 2, 'Absent': 1, 'Checked Out': 4 };
                    const curPriority = priority[current.status] || 0;
                    const newPriority = priority[a.status] || 0;
                    if (newPriority > curPriority) {
                        attendanceMap[aDate] = a;
                    }
                }
            });

            const cells = [];
            // Previous month padding
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                const d = prevMonthNumDays - i;
                const m = month === 0 ? 11 : month - 1;
                const y = month === 0 ? year - 1 : year;
                const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                cells.push({ dayNumber: d, isCurrentMonth: false, dateStr });
            }

            // Current month days
            for (let d = 1; d <= numDaysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                cells.push({ dayNumber: d, isCurrentMonth: true, dateStr });
            }

            // Next month padding
            const totalCells = Math.ceil(cells.length / 7) * 7;
            const nextMonthPadding = totalCells - cells.length;
            for (let d = 1; d <= nextMonthPadding; d++) {
                const m = month === 11 ? 0 : month + 1;
                const y = month === 11 ? year + 1 : year;
                const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                cells.push({ dayNumber: d, isCurrentMonth: false, dateStr });
            }

            const stats = { present: 0, late: 0, halfDay: 0, absent: 0, onLeave: 0, holidays: 0 };

            const localTodayStr = new Date().toLocaleDateString('sv-SE');

            const cellsHtml = cells.map(cell => {
                let cellStatus = 'None';
                let cellDetails = '';
                let colorClass = 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200';
                let dotClass = 'hidden';

                // Lookups
                const holiday = holidayMap[cell.dateStr];
                const leave = (state.myLeaveRequests || []).find(r => 
                    r.status === 'Approved' && 
                    cell.dateStr >= r.start_date.split(' ')[0] && 
                    cell.dateStr <= r.end_date.split(' ')[0]
                );
                const att = attendanceMap[cell.dateStr];

                const dayOfWeek = new Date(cell.dateStr).getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

                // Resolve Status and Colors
                if (att && att.status !== 'Absent') {
                    // Worked
                    const inTime = att.check_in_time ? new Date(att.check_in_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--';
                    const outTime = att.check_out_time ? new Date(att.check_out_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Active';
                    const hrsStr = att.total_hours ? ` (${(h => {
                        const tm = Math.round(h * 60);
                        const hrs = Math.floor(tm / 60);
                        const mins = tm % 60;
                        return `${hrs}h ${mins < 10 ? '0' : ''}${mins}m`;
                    })(att.total_hours)})` : '';

                    if (att.status === 'Present' || att.status === 'Checked Out' || att.status === 'Checked In') {
                        cellStatus = 'Present';
                        colorClass = 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border-emerald-200';
                        dotClass = 'bg-emerald-500';
                        cellDetails = `Checked In: ${inTime} &bull; Out: ${outTime}${hrsStr}`;
                        if (cell.isCurrentMonth) stats.present++;
                    } else if (att.status === 'Late') {
                        cellStatus = 'Late';
                        colorClass = 'bg-amber-50 hover:bg-amber-100 text-amber-700 border-amber-200';
                        dotClass = 'bg-amber-500';
                        cellDetails = `Late check-in &bull; Checked In: ${inTime} &bull; Out: ${outTime}${hrsStr}`;
                        if (cell.isCurrentMonth) stats.late++;
                    } else if (att.status === 'Half-Day') {
                        cellStatus = 'Half-Day';
                        colorClass = 'bg-violet-50 hover:bg-violet-100 text-violet-700 border-violet-200';
                        dotClass = 'bg-violet-500';
                        cellDetails = `Half-Day &bull; Checked In: ${inTime} &bull; Out: ${outTime}${hrsStr}`;
                        if (cell.isCurrentMonth) stats.halfDay++;
                    } else {
                        cellStatus = 'Present';
                        colorClass = 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border-emerald-200';
                        dotClass = 'bg-emerald-500';
                        cellDetails = `Checked In: ${inTime} &bull; Out: ${outTime}${hrsStr}`;
                        if (cell.isCurrentMonth) stats.present++;
                    }
                } else if (leave) {
                    cellStatus = 'On Leave';
                    colorClass = 'bg-sky-50 hover:bg-sky-100 text-sky-700 border-sky-200';
                    dotClass = 'bg-sky-500';
                    cellDetails = `Approved Leave: ${leave.reason} (${leave.leave_type})`;
                    if (cell.isCurrentMonth) stats.onLeave++;
                } else if (holiday) {
                    if (holiday.holiday_type === 'Public') {
                        cellStatus = 'Public Holiday';
                        colorClass = 'bg-cyan-50 hover:bg-cyan-100 text-cyan-700 border-cyan-200';
                        dotClass = 'bg-cyan-500';
                    } else {
                        cellStatus = 'Company Holiday';
                        colorClass = 'bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200';
                        dotClass = 'bg-fuchsia-500';
                    }
                    cellDetails = `${cellStatus}: ${holiday.name}`;
                    if (cell.isCurrentMonth) stats.holidays++;
                } else if (att && att.status === 'Absent') {
                    cellStatus = 'Absent';
                    colorClass = 'bg-rose-50 hover:bg-rose-100 text-rose-700 border-rose-200';
                    dotClass = 'bg-rose-500';
                    cellDetails = `Absent &bull; ${att.notes || 'Auto-recorded absent'}`;
                    if (cell.isCurrentMonth) stats.absent++;
                } else if (isWeekend) {
                    cellStatus = 'Weekend';
                    colorClass = 'bg-slate-50 text-slate-400 border-slate-100';
                    cellDetails = 'Weekend Rest Day';
                } else if (cell.dateStr < localTodayStr) {
                    cellStatus = 'Absent';
                    colorClass = 'bg-rose-50 hover:bg-rose-100 text-rose-700 border-rose-200';
                    dotClass = 'bg-rose-500';
                    cellDetails = 'Absent (No check-in detected)';
                    if (cell.isCurrentMonth) stats.absent++;
                } else {
                    cellStatus = 'Scheduled';
                    colorClass = 'bg-white hover:bg-slate-50 text-slate-600 border-slate-200';
                    cellDetails = 'No attendance logged yet';
                }

                let opacityClass = '';
                if (!cell.isCurrentMonth) {
                    opacityClass = 'opacity-40 pointer-events-none';
                }

                return `
                    <div class="relative group cursor-pointer ${opacityClass}">
                        <div class="h-14 sm:h-16 flex flex-col justify-between p-2 rounded-xl border ${colorClass} transition-all duration-150 shadow-sm">
                            <span class="text-xs font-black">${cell.dayNumber}</span>
                            <div class="flex justify-end">
                                <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                            </div>
                        </div>
                        
                        <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 bg-slate-950 text-white text-[11px] p-2.5 rounded-xl shadow-xl border border-slate-800 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-50 text-center text-wrap">
                            <div class="font-bold text-slate-200 border-b border-slate-800 pb-1 mb-1">${new Date(cell.dateStr).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                            <div class="font-semibold mb-0.5 text-indigo-400">${cellStatus}</div>
                            <div class="text-slate-400 font-medium leading-tight">${cellDetails}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-visible p-5 md:p-6 mb-8">
                    <div class="flex flex-col lg:flex-row gap-6 md:gap-8">
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-6">
                                <div>
                                    <h4 class="text-lg md:text-xl font-black text-slate-800 tracking-tight">
                                        ${monthNames[month]} ${year}
                                    </h4>
                                    <p class="text-xs text-slate-500 font-medium mt-0.5">Your monthly attendance overview</p>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="window.changeCalendarMonth(-1)" class="p-2 border border-slate-200 hover:bg-slate-50 text-slate-600 hover:text-slate-800 rounded-xl transition-colors shadow-sm focus:outline-none">
                                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="window.changeCalendarMonth(1)" class="p-2 border border-slate-200 hover:bg-slate-50 text-slate-600 hover:text-slate-800 rounded-xl transition-colors shadow-sm focus:outline-none">
                                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[10px] font-black uppercase tracking-wider text-slate-400">
                                <div>Sun</div>
                                <div>Mon</div>
                                <div>Tue</div>
                                <div>Wed</div>
                                <div>Thu</div>
                                <div>Fri</div>
                                <div>Sat</div>
                            </div>
                            
                            <div class="grid grid-cols-7 gap-2">
                                ${cellsHtml}
                            </div>
                        </div>
                        
                        <div class="w-full lg:w-72 shrink-0 border-t lg:border-t-0 lg:border-l border-slate-100 pt-5 lg:pt-0 lg:pl-6 flex flex-col justify-between">
                            <div>
                                <h5 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3">Month Summary</h5>
                                <div class="grid grid-cols-2 gap-2 mb-4">
                                    <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-2.5 text-center">
                                        <span class="block text-[10px] font-bold text-emerald-600">Present</span>
                                        <span class="text-base font-bold text-emerald-800">${stats.present}</span>
                                    </div>
                                    <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-2.5 text-center">
                                        <span class="block text-[10px] font-bold text-amber-600">Late</span>
                                        <span class="text-base font-bold text-amber-800">${stats.late}</span>
                                    </div>
                                    <div class="bg-violet-50/50 border border-violet-100 rounded-xl p-2.5 text-center">
                                        <span class="block text-[10px] font-bold text-violet-600">Half-Day</span>
                                        <span class="text-base font-bold text-violet-800">${stats.halfDay}</span>
                                    </div>
                                    <div class="bg-rose-50/50 border border-rose-100 rounded-xl p-2.5 text-center">
                                        <span class="block text-[10px] font-bold text-rose-600">Absent</span>
                                        <span class="text-base font-bold text-rose-800">${stats.absent}</span>
                                    </div>
                                    <div class="bg-sky-50/50 border border-sky-100 rounded-xl p-2.5 text-center col-span-2">
                                        <div class="flex justify-between items-center px-2">
                                            <span class="text-[10px] font-bold text-sky-600">Leaves & Holidays</span>
                                            <span class="text-sm font-bold text-sky-800">${stats.onLeave} L &bull; ${stats.holidays} H</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="border-t border-slate-100 pt-4">
                                <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-2.5">Legend</span>
                                <div class="grid grid-cols-2 lg:grid-cols-1 gap-2 text-[11px] font-medium text-slate-600">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded bg-emerald-50 border border-emerald-200 inline-block shrink-0"></span>
                                        <span>Present</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded bg-amber-50 border border-amber-200 inline-block shrink-0"></span>
                                        <span>Late Check-In</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded bg-violet-50 border border-violet-200 inline-block shrink-0"></span>
                                        <span>Half-Day</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded bg-rose-50 border border-rose-200 inline-block shrink-0"></span>
                                        <span>Absent</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded bg-sky-50 border border-sky-200 inline-block shrink-0"></span>
                                        <span>Approved Leave</span>
                                    </div>

        window.generateTicketId = function(projectName) {
            let prefix = "YAN";
            if (projectName && projectName !== "-- General / No Project --") {
                let cleaned = projectName.toUpperCase().replace(/[^A-Z0-9\s]/g, '').trim();
                let words = cleaned.split(/\s+/);
                if (words.length >= 3) {
                    prefix = (words[0][0] || '') + (words[1][0] || '') + (words[2][0] || '');
                } else if (words.length === 2) {
                    prefix = (words[0].substring(0, 2) || '') + (words[1][0] || '');
                } else if (words.length === 1 && words[0].length > 0) {
                    prefix = words[0].substring(0, 3);
                }
            }
            prefix = prefix.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (prefix.length < 2) {
                prefix = "YAN";
            }
            const num = Math.floor(1000 + Math.random() * 9000);
            return `${prefix}-${num}`;
        };

                                  currentVal.toUpperCase() === 'N/A' || 
                                  /^[A-Z0-9]{2,4}-\d{4}$/i.test(currentVal);

            if (isAutoOrEmpty) {
                ticketInput.value = window.generateTicketId(projectName);
            }
        };

        window.addCustomTechTag = function(inputEl) {
            const row = inputEl.closest('.dev-task-item') || inputEl.closest('.con-task-item');
            const tagsContainer = row.querySelector('.tech-tags-container');
            const tagVal = inputEl.value.trim().replace(/,/g, '');
            if (!tagVal) return;
            
            const lockedTagsStr = tagsContainer.getAttribute('data-locked-tags') || '';
            const customTagsStr = tagsContainer.getAttribute('data-custom-tags') || '';
            
            const lockedTags = lockedTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
            const customTags = customTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
            
            const tagLower = tagVal.toLowerCase();
            
            if (lockedTags.includes(tagLower) || customTags.includes(tagLower)) {
                showToast(`Tag "${tagVal}" already exists.`, 'error');
                inputEl.value = '';
                return;
            }
            
            const totalCount = lockedTags.length + customTags.length;
            if (totalCount >= 15) {
                showToast('You can add a maximum of 15 tags.', 'error');
                return;
            }
            
            const span = document.createElement('span');
            span.className = 'inline-flex items-center px-2 py-0.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm mr-1 mb-1 transition-all';

                    <i data-lucide="x" class="w-3 h-3"></i>

            const newCustomTags = customTagsStr ? `${customTagsStr},${tagVal}` : tagVal;
